<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><meta charset="utf-8"><title>dannyboi Remote</title><style>body{font:17px Arial;background:#120d22;color:white;padding:16px}input,button{box-sizing:border-box;padding:13px;border-radius:8px;font:inherit;margin:6px 0}input{width:100%;background:#27213d;color:white;border:1px solid #8c65b0}button{background:#cf25b3;color:white;border:0}#controls{display:none}.item{display:flex;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid #514365}.item img{width:90px}.item button{flex-shrink:0}small{color:#d5c5e8}</style></head><body><h2>🎤 dannyboi Remote</h2><p id="status">Enter the TV ID and PIN shown on your LG TV.</p><div id="pair"><input id="tvId" placeholder="TV ID (dannyboi-tv-...)" autocomplete="off"><input id="pin" placeholder="6-digit TV PIN" inputmode="numeric" maxlength="6"><button id="connect">Connect to TV</button></div><div id="controls"><p><button id="skip">Skip</button> <button id="next">Play next</button> <button id="clear">Clear queue</button></p><h3>Find YouTube karaoke</h3><input id="apiKey" placeholder="YouTube Data API key" type="password" value="AIzaSyDWBXrmebCs6TMViQOVdvm14KE1zcgTFKA"><small>Key is stored in the APK and can be extracted. Restrict it in Google Cloud Console to YouTube Data API v3 and rotate if exposed.</small><input id="searchTerm" placeholder="Song or artist"><button id="search">Search embeddable videos</button><div id="results"></div><h3>Or paste a video URL</h3><input id="videoUrl" placeholder="YouTube video URL"><input id="videoTitle" placeholder="Song title"><button id="addUrl">Add to queue</button><h3>TV Queue</h3><div id="queue"></div></div><script src="https://unpkg.com/peerjs@1.5.5/dist/peerjs.min.js"></script><script>
(function(){var $=function(x){return document.getElementById(x)},peer=null,conn=null;function status(s){$('status').textContent=s;}function send(m){if(conn&&conn.open)conn.send(m);}function vid(s){var m=(s||'').match(/(?:youtu\.be\/|[?&]v=|\/embed\/|\/shorts\/)([\w-]{11})/);return m?m[1]:/^[\w-]{11}$/.test(s)?s:null;}
$('connect').onclick=function(){if(!window.Peer){status('PeerJS failed to load. Check internet.');return;}if(peer)peer.destroy();status('Connecting…');peer=new Peer({host:'0.peerjs.com',secure:true,port:443,path:'/'});peer.on('open',function(){conn=peer.connect($('tvId').value.trim(),{reliable:true});conn.on('open',function(){send({type:'pair',pin:$('pin').value.trim()});});conn.on('data',function(m){if(m.type==='paired'){$('pair').style.display='none';$('controls').style.display='block';status('Connected to LG TV');send({type:'state'});}else if(m.type==='error'){status(m.message);}else if(m.type==='state'){$('queue').textContent=(m.active?'Playing: '+m.active.title+'\n':'')+(m.queue||[]).map(function(x,i){return (i+1)+'. '+x.title;}).join(' | ');}});conn.on('close',function(){status('Disconnected. Reconnect to TV.');$('pair').style.display='block';$('controls').style.display='none';});conn.on('error',function(e){status('Connection failed: '+e);});});peer.on('error',function(e){status('Signaling error: '+(e.type||e.message));});};
$('skip').onclick=function(){send({type:'skip'});};$('next').onclick=function(){send({type:'next'});};$('clear').onclick=function(){send({type:'clear'});};$('addUrl').onclick=function(){var id=vid($('videoUrl').value);if(id)send({type:'enqueue',id:id,title:$('videoTitle').value||id});else status('Invalid YouTube URL');};
$('searchTerm').addEventListener('keydown',function(e){if(e.key==='Enter')$('search').click();});$('search').onclick=function(){var q=$('searchTerm').value.trim(),key=$('apiKey').value.trim();if(!q||!key){status('Enter song and YouTube API key');return;}status('Searching…');fetch('https://www.googleapis.com/youtube/v3/search?part=snippet&type=video&videoEmbeddable=true&maxResults=12&q='+encodeURIComponent(q+' karaoke')+'&key='+encodeURIComponent(key)).then(function(r){if(!r.ok)return r.json().then(function(d){throw Error('HTTP '+r.status+': '+((d.error&&d.error.message)||'Check key, quota and API restrictions'));});return r.json();}).then(function(data){$('results').textContent='';if(!(data.items||[]).length){status('No embeddable results found');}(data.items||[]).forEach(function(it){var id=it.id&&it.id.videoId;if(!id)return;var d=document.createElement('div');d.className='item';var img=document.createElement('img');img.src=it.snippet.thumbnails.default.url;var label=document.createElement('span');label.textContent=it.snippet.title;var b=document.createElement('button');b.textContent='Queue';b.onclick=function(){send({type:'enqueue',id:id,title:it.snippet.title});};d.append(img,label,b);$('results').appendChild(d);});status((data.items||[]).length+' results; playback still depends on TV embedding support');}).catch(function(e){status('Search error: '+e.message);});};
})();</script></body></html>
