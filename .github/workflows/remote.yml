name: Build Android TV Remote APK
on: [workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Build debug APK
        run: gradle -p android-remote :app:assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: dannyboi-tv-remote-apk
          path: android-remote/app/build/outputs/apk/debug/app-debug.apk
